<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Slop Scan RED fixture — 每条规则各一处真违规，供 tests/test_slop_scan.py 断言</title>
<style>
  :root {
    --color-primary: #0f766e;
    --color-ink: #141414;
    --space-md: 16px;
  }

  /* 1 ai-default-hex */
  .badge { color: #6366f1; }

  /* 2 banned-display-font */
  h1 { font-family: Inter, system-ui; }

  /* 3 gradient-hero + 4 gradient-text */
  .hero { background: linear-gradient(135deg, #8b5cf6, #3b82f6); min-height: 100vh; }
  .hero h1 { background: linear-gradient(90deg, #a855f7, #06b6d4); -webkit-background-clip: text; background-clip: text; }

  /* 5 transition-all + 6 animate-layout-props + 7 overshoot-easing */
  .card { transition: all 300ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  .drawer { transition: height 240ms ease; }

  /* 8 italic-heading */
  h2 { font-style: italic; }

  /* 9 too-many-font-families (4 个 distinct) */
  .a { font-family: "Bricolage Grotesque"; }
  .b { font-family: "Instrument Serif"; }
  .c { font-family: "IBM Plex Mono"; }

  /* 10 non-4px-spacing */
  .pad { padding: 17px 23px; margin-top: 13px; }

  /* 11 prose-width */
  .prose { max-width: 90ch; }

  /* 15 glassmorphism (>=3 处) */
  .g1 { backdrop-filter: blur(12px); }
  .g2 { backdrop-filter: blur(8px); }
  .g3 { backdrop-filter: blur(20px); }

  /* 19 bare-hex-count (:root 之外 >12 个) */
  .c1 { color: #111111; } .c2 { color: #222222; } .c3 { color: #333333; }
  .c4 { color: #444444; } .c5 { color: #555555; } .c6 { color: #666666; }
  .c7 { color: #777777; } .c8 { color: #888888; } .c9 { color: #999999; }
  .c10 { color: #aaaaaa; } .c11 { color: #bbbbbb; } .c12 { color: #cccccc; }
  .c13 { color: #dddddd; }

  /* 20 side-stripe-card */
  .tile { border-left: 5px solid #0f766e; border-radius: 12px; }

  /* 23 equal-three-col + 24 bare-1fr */
  .features { display: grid; grid-template-columns: repeat(3, 1fr); }
  .gallery { display: grid; grid-template-columns: 1fr 1fr; }

  /* 25 动效但全文件无 prefers-reduced-motion（由规则 25 检测缺失） */
  @keyframes float-up { from { opacity: 0; } to { opacity: 1; } }
  .anim { animation: float-up 600ms ease both; }

  button.ctl:hover { transform: translateY(-2px); }

  /* 渲染层探针用：真正低对比的两例（浅字白底 / 深底深字） */
  .faint { color: #c9c9c9; }
  .panel-dark { background: #101010; padding: 16px; }
  .panel-dark p { color: #1a1a1a; }
</style>
</head>
<body>
  <header class="hero">
    <h1>Ship faster</h1>
    <p>Acme Nexus 让团队无缝释放产能</p>
    <button class="ctl">🚀 立即开始</button>
  </header>

  <!-- 16 emoji-icons -->
  <section>
    <h2>✨ 核心能力</h2>
    <div class="tile"><h3>01 / FAST</h3><p>功能一</p></div>
    <div class="tile"><h3>02 / SAFE</h3><p>功能二</p></div>
    <div class="tile"><h3>03 / SIMPLE</h3><p>功能三</p></div>
  </section>

  <!-- 17 placeholder-cdn -->
  <section class="features">
    <div class="card"><img src="https://images.unsplash.com/photo-1" alt=""><h4>快速</h4><p>三段式介绍文案</p></div>
    <div class="card"><img src="https://picsum.photos/600/400" alt=""><h4>稳定</h4><p>三段式介绍文案</p></div>
    <div class="card"><img src="https://placehold.co/600x400"><h4>简单</h4><p>三段式介绍文案</p></div>
  </section>

  <!-- 18 filler-copy -->
  <section class="prose">
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </section>

  <!-- 21 decorative-svg-no-aria -->
  <section>
    <svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#0f766e"></circle></svg>
  </section>

  <!-- 22 fake-metrics -->
  <section class="gallery">
    <div class="g1"><p class="stat">10× 更快</p></div>
    <div class="g2"><p class="stat">99.9% 在线</p></div>
  </section>

  <!-- 13 autoplay-not-muted, 14 lazy-lcp -->
  <img class="hero cover" src="assets/hero.jpg" loading="lazy" alt="">
  <video autoplay loop playsinline src="demo.mp4"></video>

  <!-- 26 missing-states：.ctl 只有 :hover，无 focus-visible/active/disabled -->
  <a class="ctl" href="#">了解更多</a>

  <p class="faint">浅灰字压白底，对比度约 1.6</p>
  <div class="panel-dark"><p>深底深字，几乎读不出来</p></div>
</body>
</html>
