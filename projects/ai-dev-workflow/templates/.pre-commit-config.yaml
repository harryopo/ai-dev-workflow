# Pre-commit hooks 配置（v3.2 · 减法重构版）
# 安装: pre-commit install
# 手动运行所有: pre-commit run --all-files
# 跳过的原因: SKIP=hook-id git commit -m "..."
#
# v3.2 关键变化（基于用户反馈 2026-07-22）：
#   - ❌ 删除 AGENTS.md ≤ 150 行硬卡 → 🟡 改为 warning（v3.2 软化）
#   - ❌ 删除 Source files ≤ 800 行硬卡 → 🟡 改为 warning
#   - ❌ 删除 cli/mcp/ui ≤ 200 行硬卡 → 🟡 改为 warning
#   - ❌ 删除 ESLint --max-warnings=0 → 🟡 默认有 warning 但不阻塞
#   - ❌ 删除 Assisted-by trailer 强制 → 🟡 commitlint 软性建议
#   - ✅ 保留 gitleaks（密钥安全 R1 红线）
#   - ✅ 保留 detect-private-key（R1 红线）
#   - ✅ 保留 no-commit-to-branch（保护主分支）
#   - ✅ 保留 ruff/mypy/eslint（代码质量，软性）

# ============================================================
# 顶部配置
# ============================================================
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false  # v3.2 软化：失败继续，让所有 hook 跑完

# ============================================================
# 通用检查 + 业务约束
# ============================================================
repos:
  # ----- 1. 通用文件检查（pre-commit/hooks）-----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']  # v3.2 软化：从 500 KB 提到 1000 KB（大文件不阻塞）
      - id: detect-private-key  # 🔴 R1 安全红线
      - id: no-commit-to-branch  # 保护主分支
        args: ['--branch', 'main', '--branch', 'master']
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # ----- 2. 秘密检测（gitleaks · R1 安全红线）-----
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.20.0
    hooks:
      - id: gitleaks  # 🔴 阻塞：发现密钥立即失败

  # ----- 3. Conventional Commits（v3.2 软化）-----
  - repo: https://github.com/commitlint/commitlint
    rev: v19.5.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
        # v3.2 软化：不再强制 Assisted-by trailer
        # 团队可选择性配置，但默认是 warning 而非 error

  # ----- 4. AGENTS.md 长度检查（v3.2 软化为 warning）-----
  - repo: local
    hooks:
      - id: warn-agents-md-length
        name: AGENTS.md length warning (soft, ≤ 200 recommended)
        entry: bash -c 'if [ -f AGENTS.md ] && [ "$(wc -l < AGENTS.md)" -gt 200 ]; then echo "⚠️  WARNING: AGENTS.md is $(wc -l < AGENTS.md) lines (v3.2 soft cap: 200). Consider moving detail to docs/agent-handbook.md. (Not blocking - you can commit anyway)"; fi'
        language: system
        files: '^AGENTS\.md$'
        pass_filenames: false

      # ----- 5. 文件长度检查（v3.2 软化为 warning）-----
      - id: warn-file-length
        name: Source files length warning (soft, ≤ 2000 recommended)
        entry: bash -c 'for f in "$@"; do if [ -f "$f" ] && [ "$(wc -l < "$f")" -gt 2000 ]; then echo "⚠️  WARNING: $f is $(wc -l < "$f") lines (v3.2 soft cap: 2000 for business files). Consider splitting. (Not blocking)"; fi; done' --
        language: system
        types: [file]
        files: '\.(ts|tsx|js|jsx|py|go|rs|java|kt)$'

      # ----- 6. 业务逻辑分层检查（v3.2 软化为 warning，CLI 工具可豁免）-----
      - id: warn-thin-layer
        name: Thin presentation layer (soft warning for cli/mcp/ui > 500 lines)
        entry: bash -c 'for f in $(find cli mcp ui -type f \( -name "*.ts" -o -name "*.py" -o -name "*.go" -o -name "*.rs" \) 2>/dev/null); do if [ -f "$f" ] && [ "$(wc -l < "$f")" -gt 500 ]; then echo "⚠️  WARNING: $f is $(wc -l < "$f") lines (v3.2 soft cap: 500 for thin layer). Consider extracting to core/. CLI tools can ignore this. (Not blocking)"; fi; done'
        language: system
        pass_filenames: false

# ============================================================
# TypeScript / JavaScript
# ============================================================
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.15.0
    hooks:
      - id: eslint
        files: \.(ts|tsx|js|jsx)$
        types: [file]
        # v3.2 软化：删除 --max-warnings=0，默认允许 warning
        # 团队可选择性加强
        additional_dependencies:
          - eslint@9.15.0
          - typescript@5.6.3
          - '@typescript-eslint/parser@8.15.0'
          - '@typescript-eslint/eslint-plugin@8.15.0'

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        files: \.(ts|tsx|js|jsx|json|css|md|yaml|yml)$

# ============================================================
# Python（ruff v0.7+ 一体化）
# ============================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ['check', '--fix', '--unsafe-fixes']
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: ['--ignore-missing-imports']  # v3.2 软化：删除 --strict
        additional_dependencies: [pydantic, types-requests, types-redis]

# ============================================================
# 安全（OWASP Top 10 + Python 依赖审计）
# ============================================================
  - repo: https://github.com/pypa/pip-audit
    rev: v2.7.3
    hooks:
      - id: pip-audit
        args: ['-r', 'requirements.txt']
        files: '^requirements.*\.txt$'
        # v3.2 软化：删除 --strict（不再因单次失败就阻塞）

# ============================================================
# commitlint 配置（commit-msg 阶段 · v3.2 软化）
# ============================================================
# commitlint.config.js 建议在项目根目录：
#
# ```javascript
# module.exports = {
#   extends: ['@commitlint/config-conventional'],
#   rules: {
#     'header-max-length': [2, 'always', 100],
#     'type-enum': [2, 'always', [
#       'feat', 'fix', 'docs', 'style', 'refactor',
#       'perf', 'test', 'build', 'ci', 'chore', 'revert'
#     ]],
#     // v3.2 软化：Assisted-by trailer 不再强制
#     // 团队可以选择性启用：
#     // 'assisted-by-present': [1, 'warn'],  // 1 = warning, 2 = error
#   },
# };
# ```

# ============================================================
# v3.2 跳过指南
# ============================================================
# 紧急情况跳过全部：git commit --no-verify -m "..."
# 跳过特定 hook：SKIP=gitleaks git commit -m "..."
# 跳过 warning 类（不推荐）：SKIP=warn-agents-md-length,warn-file-length git commit -m "..."
# ============================================================

# ============================================================
# v3.2 vs v3.1 变化对照
# ============================================================
# v3.1: 6 个阻塞 hook（AGENTS.md 长度、文件长度、薄层、ESLint 严格、mypy strict、Assisted-by 强制）
# v3.2: 1 个阻塞 hook（仅 gitleaks 密钥检测），其他全部 warning
# v3.2 哲学：安全红线绝不妥协，规范建议不阻塞
